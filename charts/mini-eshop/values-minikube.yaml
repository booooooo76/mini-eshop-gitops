image:
  tag: "1.7.0"

config:
  environment: Development
  logLevel: Information

app:
  replicas: 3
  progressDeadlineSeconds: 60

metrics:
  serviceMonitor:
    enabled: true

rollout:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause: {duration: 30s}
        - setWeight: 80
        - pause: {duration: 30s}

secrets:
  existingSecret: mini-eshop-db

rabbitmq:
  resources:
    limits:
      cpu: "2"

ingress:
  enabled: false

hooks:
  preUpgradeCheck:
    enabled: false

tests:
  enabled: false
