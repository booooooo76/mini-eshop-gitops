image:
  tag: "1.2.0"

config:
  environment: Development
  logLevel: Information

app:
  replicas: 2
  progressDeadlineSeconds: 60

secrets:
  existingSecret: mini-eshop-db

rabbitmq:
  resources:
    limits:
      cpu: "2"

ingress:
  enabled: false

hooks:
  preUpgradeCheck:
    enabled: false

tests:
  enabled: false
