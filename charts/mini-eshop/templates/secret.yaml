{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mini-eshop.secretName" . }}
  labels:
    {{- include "mini-eshop.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required: pass it with --set secrets.postgresPassword=... or point secrets.existingSecret to a Secret in the namespace" .Values.secrets.postgresPassword | quote }}
{{- end }}
