{{- if .Values.metrics.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mini-eshop.fullname" . }}-dashboard
  labels:
    {{- include "mini-eshop.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  mini-eshop.json: |-
    {{- .Files.Get "dashboards/mini-eshop.json" | nindent 4 }}
{{- end }}
